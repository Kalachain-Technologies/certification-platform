<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification - Kalachain</title>
<style>
:root {
  --paper: #ffffff;
  --paper-edge: #fffdf8;
  --ink: #14213d;
  --ink-soft: #3d4a63;
  --gold: #c66b12;
  --gold-deep: #14213d;
  --card-bg: #fff8ee;
  --card-border: #e9d0a9;
  --border-color: #e9d0a9;
}
  * { box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #f4efe7;
    color: var(--ink);
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .certificate-container {
    background: var(--paper);
    max-width: 1000px;
    width: min(100%, 1000px);
    min-height: 640px;
    padding: 52px 48px 42px;
    border: 3px solid var(--gold);
    border-radius: 4px;
    box-shadow: 0 12px 32px rgba(120, 68, 24, 0.15);
    position: relative;
    overflow: hidden;
  }
  .certificate-container::before {
    content: ""; position: absolute; inset: 11px;
    border: 1px solid var(--gold);
    opacity: 0.65;
    pointer-events: none;
  }
  .corner-flourish {
    position: absolute; width: 150px; height: 150px; opacity: 1; pointer-events: none; z-index: 0;
  }
  

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
  margin-bottom: 18px;
  position: relative;
  z-index: 1;
  gap: 2px;
  padding: 0 130px;
}
  .logo-badge {
    position: absolute;
    top: 20px;
    left: 35px;
    width: 100px;
    height: 100px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    margin: 0;
    z-index: 2;
  }
  .logo-badge img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    border-radius: 12px;
  }
 .brand-name {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #b91c1c;
  text-align: center;
  margin: 0 0 4px;
  line-height: 1.25;
}

.workshop-by {
  font-size: 16px;
  color: var(--gold-deep);
  text-transform: none;
  letter-spacing: 0.5px;
  margin: 12px 0 2px;
  font-style: italic;
  font-weight: 600;
  opacity: 0.85;
}

  .cert-title {
    font-size: 17px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
    margin: 0;
  }
  .title-rule { width: 90px; height: 1px; background: var(--gold); opacity: 0.75; margin: 10px auto 0; }

  .recipient-section {
    text-align: center;
    margin: 10px 0 30px;
    position: relative;
    z-index: 1;
  }
  .statement {
    font-style: italic;
    color: var(--ink-soft);
    margin-bottom: 8px;
    font-size: 15.5px;
  }
  .name {
    font-size: 32px;
    font-weight: 700;
    color: var(--ink);
    border-bottom: 2px solid var(--gold);
    display: inline-block;
    padding: 0 10px 6px;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    min-width: 260px;
  }
  .course {
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    margin: 4px 0;
  }

  .meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px; margin-bottom: 34px; padding: 16px 20px;
    background: var(--card-bg); border-radius: 8px; border: 1px solid var(--card-border);
    position: relative; z-index: 1;
  }
  .meta-item { font-size: 13px; }
  .meta-label {
    color: var(--ink-soft); font-weight: 600; display: block; margin-bottom: 3px;
    font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; font-family: Arial, sans-serif;
  }
  .meta-value { color: var(--ink); font-weight: 700; font-size: 15px; }
  .grade-badge { color: var(--gold-deep); }

  .section-title {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-deep);
    text-align: center; margin-bottom: 4px; font-weight: 700; font-family: Arial, sans-serif;
  }
  .section-subtitle {
    text-align: center; font-size: 10.5px; color: var(--ink-soft); letter-spacing: 1.5px;
    text-transform: uppercase; margin-bottom: 18px; font-family: Arial, sans-serif;
  }
  .evaluator-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 20px 22px; margin-bottom: 26px; display: flex; gap: 20px; flex-wrap: wrap;
    position: relative; z-index: 1;
  }
  .evaluator-left { flex: 1; min-width: 130px; }
  .evaluator-name { font-weight: 700; font-size: 16px; color: var(--ink); margin: 0; }
  .evaluator-title { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 12px; }
  .audio-player { width: 100%; max-width: 200px; height: 32px; }
  .evaluator-right { flex: 1.6; min-width: 200px; }
  .transcript-box {
    font-size: 13.5px; line-height: 1.5; color: var(--ink); background: var(--paper);
    padding: 12px 14px; border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0;
    margin-bottom: 10px; font-style: italic;
  }
  .hash-line { font-size: 11px; color: var(--ink-soft); font-family: Arial, sans-serif; }
  .hash-line strong { display: block; font-weight: 700; margin-bottom: 2px; }
  .hash-value { font-family: 'Courier New', monospace; font-size: 10.5px; word-break: break-all; color: var(--gold-deep); }

  .blockchain-footer {
    margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--card-border);
    font-size: 12px; color: var(--ink-soft); text-align: center; position: relative; z-index: 1;
    font-family: Arial, sans-serif;
  }
  .hosted-by { margin-bottom: 12px; }
  .hosted-by strong { color: var(--ink); }
  .footer-row { margin-bottom: 8px; }
  .tx-label { font-weight: 600; margin-bottom: 5px; }
  .tx-hash {
    font-family: 'Courier New', monospace; word-break: break-all; background: var(--card-bg);
    padding: 8px 12px; border-radius: 6px; display: block; font-size: 11px; margin-bottom: 12px;
  }
  .verify-link { color: var(--gold); text-decoration: none; font-weight: 700; }

  .state-message { text-align: center; color: var(--ink-soft); font-size: 16px; padding: 60px 20px; font-family: Arial, sans-serif; }
  .state-message.error { color: #a13a3a; }
</style>
</head>
<body>
  <div class="certificate-container" id="certificate-root">
    <div class="state-message" id="loading-state">Loading certificate...</div>
  </div>

<script>
  const SUPABASE_URL = "https://cerszoqebrpwjbeiooxt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlcnN6b3FlYnJwd2piZWlvb3h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzgzNDEsImV4cCI6MjEwMDg1NDM0MX0.SDGcTSCcE1IPx_Q8bGeFqyWbcdYWisc-okA4fHPgSDc";

  function getTokenIdFromUrl() {
    return new URLSearchParams(window.location.search).get("id");
  }

  function showError(message) {
    document.getElementById("certificate-root").innerHTML =
      `<div class="state-message error"><strong>Certificate not found.</strong><br><br>${message}</div>`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  function attr(meta, traitType) {
    const found = (meta.attributes || []).find(a => a.trait_type === traitType);
    return found ? found.value : "";
  }

  function renderCertificate(row, isEvaluation) {
    const issueDate = row.created_at
      ? new Date(row.created_at).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })
      : "";

    const gradeRow = isEvaluation ? `
        <div class="meta-item">
            <span class="meta-label">Grading Evaluation Tier</span>
            <span class="meta-value grade-badge">${escapeHtml(row.grade || "")}${row.marks_total ? ` (${escapeHtml(String(row.marks_total))}/${escapeHtml(String(row.marks_max || 100))})` : ""}</span>
        </div>` : "";

    const voiceSection = isEvaluation ? `
    <p class="section-title">Official Evaluator Voice Feedback</p>
    <p class="section-subtitle">(On-Chain Record)</p>
    <div class="evaluator-card">
        <div class="evaluator-left">
            <h3 class="evaluator-name">${escapeHtml(row.evaluator_name || "")}</h3>
            <p class="evaluator-title">${escapeHtml(row.evaluator_title || "Evaluator")}</p>
            ${row.audio_feedback_url ? `<audio class="audio-player" controls preload="none" src="${row.audio_feedback_url}"></audio>` : ""}
        </div>
        <div class="evaluator-right">
            ${row.comments ? `<div class="transcript-box">&ldquo;${escapeHtml(row.comments)}&rdquo;</div>` : ""}
            ${row.audio_feedback_url ? `<div class="hash-line"><strong>Audio Feedback Reference:</strong><span class="hash-value">${escapeHtml(row.audio_feedback_url)}</span></div>` : ""}
        </div>
    </div>` : "";

    const name = isEvaluation ? row.participant_name : row.name;
    const eventName = isEvaluation ? row.event_name : row.workshop_name;

    document.getElementById("certificate-root").innerHTML = `
   

    <div class="logo-badge">
      <img src="kalachain-logo.jpeg" alt="Kalachain logo">
    </div>

    <div class="header">
 <h2 class="brand-name">Kalachain Creative Technologies Private Limited</h2>

      <div>
        <p class="cert-title">Certificate of ${isEvaluation ? "Evaluation" : "Excellence"}</p>
        <p class="workshop-by">Workshop by Dr. Urvashi Mohinani</p>
        <div class="title-rule"></div>
      </div>
    </div>

    <div class="recipient-section">
        <p class="statement">${isEvaluation ? "Awarded to" : "This is officially compiled to verify that"}</p>
        <div class="name">${escapeHtml(name || "")}</div>
        <p class="statement">participated in the workshop and presented the assigned work</p>
        <p class="course">${escapeHtml(eventName || "")}</p>
    </div>

    <div class="meta-grid">
        ${gradeRow}
        <div class="meta-item">
            <span class="meta-label">Official Issue Date</span>
            <span class="meta-value">${issueDate}</span>
        </div>
        <div class="meta-item">
            <span class="meta-label">Verification Record ID</span>
            <span class="meta-value">Token #${escapeHtml(String(row.token_id || ""))}</span>
        </div>
    </div>

    ${voiceSection}

    <div class="blockchain-footer">
        <div class="hosted-by">Hosted by: <strong>Kalachain Creative Technologies</strong></div>
        <div class="footer-row"><strong>Status:</strong> Permanently Witnessed</div>
        <div class="tx-label">On-Chain Transaction Hash:</div>
        <span class="tx-hash">${escapeHtml(row.tx_hash || "")}</span>
        <a href="${row.verification_link}" class="verify-link">Verify on PolygonScan &rarr;</a>
    </div>
    `;
  }

  async function fetchFromTable(table, tokenId) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${table}?token_id=eq.${encodeURIComponent(tokenId)}&select=*`,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      }
    );
    if (!res.ok) throw new Error(`Supabase request failed (${res.status})`);
    return res.json();
  }

  async function loadCertificate() {
    const tokenId = getTokenIdFromUrl();
    if (!tokenId) {
      showError("No certificate ID was provided in the link. Please check the link and try again.");
      return;
    }
    try {
      const [participantRows, evaluationRows] = await Promise.all([
        fetchFromTable("participants", tokenId),
        fetchFromTable("evaluations", tokenId),
      ]);

      if (evaluationRows.length) {
        renderCertificate(evaluationRows[0], true);
      } else if (participantRows.length) {
        renderCertificate(participantRows[0], false);
      } else {
        showError(`No certificate exists for ID "${escapeHtml(tokenId)}".`);
      }
    } catch (err) {
      showError(`Something went wrong loading this certificate. (${err.message})`);
    }
  }

  loadCertificate();
</script>
</body>
</html>
